<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Tickets - Centro de Soporte</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">📋 Centro de Soporte</a>
            <button class="btn btn-light ms-auto" onclick="mostrarSeccion('buscar')">Mis Tickets</button>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- SECCIÓN: CREAR TICKET -->
        <div id="seccion-crear" class="seccion active">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">✉️ Crear Nuevo Ticket</h5>
                        </div>
                        <div class="card-body">
                            <form id="formulario-ticket">
                                <div class="mb-3">
                                    <label class="form-label">Nombre Completo *</label>
                                    <input type="text" class="form-control" id="nombre" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Correo Electrónico *</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Asunto *</label>
                                    <input type="text" class="form-control" id="asunto" placeholder="Ej: Problema con mi pedido" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Descripción del Problema *</label>
                                    <textarea class="form-control" id="descripcion" rows="5" placeholder="Describe tu problema con detalle..." required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Prioridad</label>
                                    <select class="form-select" id="prioridad">
                                        <option value="baja">Baja</option>
                                        <option value="normal" selected>Normal</option>
                                        <option value="alta">Alta</option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary btn-lg w-100">Enviar Ticket</button>
                            </form>
                            <div id="mensaje-exito" class="alert alert-success mt-3" style="display: none;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN: BUSCAR TICKETS -->
        <div id="seccion-buscar" class="seccion">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card shadow">
                        <div class="card-header bg-primary text-white">
                            <h5 class="mb-0">🔍 Buscar Mis Tickets</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Ingresa tu Correo Electrónico</label>
                                <input type="email" class="form-control" id="email-buscar" placeholder="tu@correo.com">
                                <button class="btn btn-primary mt-2 w-100" onclick="buscarTickets()">Buscar</button>
                            </div>
                            <div id="lista-tickets"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- SECCIÓN: VER TICKET DETALLADO -->
        <div id="seccion-ticket" class="seccion">
            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <button class="btn btn-secondary mb-3" onclick="mostrarSeccion('buscar')">← Volver</button>

                    <div class="card shadow mb-3">
                        <div class="card-header" id="header-ticket">
                            <h5 class="mb-0" id="titulo-ticket">Ticket #</h5>
                        </div>
                        <div class="card-body" id="contenido-ticket"></div>
                    </div>

                    <!-- Mensajes -->
                    <div class="card shadow">
                        <div class="card-header bg-light">
                            <h6 class="mb-0">💬 Historial de Mensajes</h6>
                        </div>
                        <div class="card-body" style="max-height: 400px; overflow-y: auto;" id="lista-mensajes"></div>

                        <div class="card-footer">
                            <div class="input-group">
                                <input type="text" class="form-control" id="nuevo-mensaje" placeholder="Escribe tu mensaje...">
                                <button class="btn btn-primary" onclick="agregarMensaje()">Enviar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
